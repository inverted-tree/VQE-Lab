[project]
name = "vqe-lab"
version = "0.1.0"
description = "A compact notebook-first Qiskit VQE study library"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.10",
    "numpy>=2.4",
    "pylatexenc>=2.11",
    "qiskit>=2.4",
    "qiskit-aer>=0.17",
    "qiskit-algorithms>=0.4",
]

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"
